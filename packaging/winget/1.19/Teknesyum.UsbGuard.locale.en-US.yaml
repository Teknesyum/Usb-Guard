ShortDescription: Cleans the shortcut worm off a USB stick, immunizes the stick, and checks the PC behind it.
Description: |-
  USB-Guard is a single-file console tool for the shortcut worm — the infection that hides
  every folder on a USB stick and leaves a matching .lnk in its place, so the files look
  present and open the worm instead.

  It quarantines the payload rather than deleting it, moves the hidden folders back out,
  clears the hidden and system attributes, and then immunizes the stick: the names the worm
  needs are turned into locked folders it cannot recreate. It also scans the PC behind the
  stick for the startup entries the worm leaves there, and can switch off script-host
  execution and execution from removable drives.

  It is not an antivirus and does not replace one. What it deliberately leaves alone is
  listed in the README under "What It Does Not Do".
